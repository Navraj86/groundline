# Local development infrastructure for Groundline.
# App processes (web, api, ai) run on the host via `pnpm dev`; this file runs their dependencies.
name: groundline

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: groundline
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_password}
    ports:
      - "${DB_PORT:-54322}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d groundline"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Supabase Auth (GoTrue). Self-hosted locally; in production point the API at a Supabase project instead.
  auth:
    image: supabase/auth:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${AUTH_PORT:-9999}:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${AUTH_PORT:-9999}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:-auth_dev_password}@db:5432/groundline?sslmode=disable
      GOTRUE_SITE_URL: ${WEB_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${WEB_URL:-http://localhost:3000}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET must be set in .env}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_INVITE: /verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirm your Groundline account"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Reset your Groundline password"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@groundline.local
      GOTRUE_SMTP_SENDER_NAME: Groundline
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_LOG_LEVEL: info

  # Catches every email sent in development. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db-data:
  redis-data:
