apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ai }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ai }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ai
          image: groundline/ai
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: groundline }
            - secretRef: { name: groundline }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ai
spec:
  selector: { app.kubernetes.io/name: ai }
  ports: [{ name: http, port: 8000, targetPort: http }]
