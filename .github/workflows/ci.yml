name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Lint, typecheck, test and build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build --filter='!@groundline/ai'

  api-e2e:
    name: API end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: groundline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d groundline"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/groundline
      SUPABASE_AUTH_URL: http://localhost:9999
      SUPABASE_JWT_SECRET: ci-only-secret-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @groundline/shared build
      - run: pnpm --filter @groundline/api exec prisma migrate deploy
      - run: pnpm --filter @groundline/api test:e2e

  ai:
    name: AI service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  terraform:
    name: Terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [aws-ec2, aws-ecs]
    defaults:
      run:
        working-directory: deploy/${{ matrix.stack }}/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.x
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: kubectl kustomize deploy/k8s > rendered.yaml
      - run: docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary /w/rendered.yaml

  # Builds every image for amd64 and arm64 (native runners) on each push and pull request.
  # From main, each architecture is pushed to GitHub Container Registry and then merged into
  # multi-arch tags: the commit SHA and "main".
  images:
    name: Image (${{ matrix.image.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: [typescript, api-e2e, ai]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image:
          - { name: web, dockerfile: apps/web/Dockerfile, target: runtime }
          - { name: api, dockerfile: apps/api/Dockerfile, target: runtime }
          - { name: migrate, dockerfile: apps/api/Dockerfile, target: migrate }
          - { name: ai, dockerfile: apps/ai/Dockerfile, target: runtime }
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch }}

  publish:
    name: Publish multi-arch images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          for name in web api migrate ai; do
            docker buildx imagetools create               --tag "$base/$name:$GITHUB_SHA" --tag "$base/$name:main"               "$base/$name:$GITHUB_SHA-amd64" "$base/$name:$GITHUB_SHA-arm64"
          done
