name: Deploy backend to AWS (EC2)

# Deploys the backend to the low-cost EC2 instance (deploy/aws-ec2) after CI passes on main,
# using the multi-arch images CI published to GHCR. Can also be run by hand for any commit
# whose images exist. The web app deploys separately through Vercel's Git integration.
#
# Setup (docs/deploy-aws.md, step 9): a "production" environment with these variables:
#   AWS_DEPLOY_ROLE_ARN   terraform output github_deploy_role_arn
#   AWS_REGION            e.g. ap-south-1
#   AWS_INSTANCE_ID       terraform output instance_id
# Until AWS_DEPLOY_ROLE_ARN is set, this workflow skips itself.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (its images must already be published)
        required: true

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run the deploy on the instance
        env:
          INSTANCE: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Not a full commit SHA: $SHA"; exit 1; }
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "Deploy $SHA" --timeout-seconds 900 \
            --parameters "commands=[\"/usr/local/bin/groundline-deploy $SHA\"],executionTimeout=[\"900\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $id"
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text
          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query StandardErrorContent --output text >&2
            echo "::error::Deploy finished with status $status"
            exit 1
          fi
          echo "Deployed \`$SHA\` to the backend instance." >> "$GITHUB_STEP_SUMMARY"
